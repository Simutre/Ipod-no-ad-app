<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>iPod Classic - Lecteur Musical</title>
  
  <meta name="theme-color" content="#d8dce2" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://www.youtube.com/iframe_api"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    .ipod-screen {
      font-family: "Lucida Grande", "Segoe UI", -apple-system, Helvetica, Arial, sans-serif;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.4), inset 0 0 2px rgba(0, 0, 0, 0.8);
      background: #f7f9fb;
    }

    .ipod-header-gradient {
      background: linear-gradient(to bottom, #dbe2ec 0%, #b8c4d4 50%, #9baec2 51%, #a8b8cb 100%);
      border-bottom: 1px solid #7d8f9f;
    }

    .ipod-selected-row {
      background: linear-gradient(to bottom, #4f96e4 0%, #1f6fd1 48%, #1459b7 52%, #1a6cd1 100%);
      color: #ffffff !important;
    }

    .screen-glass-glare {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0.05) 50%, transparent 51%);
      pointer-events: none;
    }

    .click-wheel {
      background: radial-gradient(circle at 50% 50%, #ffffff 0%, #ececec 65%, #d8d8d8 100%);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2), inset 0 1px 2px rgba(255, 255, 255, 0.8), inset 0 -2px 3px rgba(0, 0, 0, 0.15);
    }

    .center-button {
      background: radial-gradient(circle at 45% 45%, #ffffff 0%, #f0f0f0 60%, #dedede 100%);
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.15), 0 2px 5px rgba(0, 0, 0, 0.1);
    }
    .center-button:active {
      background: #dedede;
      transform: scale(0.96);
    }

    .ipod-chassis-white {
      background: linear-gradient(145deg, #ffffff 0%, #eceff3 50%, #d8dee6 100%);
      box-shadow: 0 20px 40px -10px rgba(0,0,0,0.4), 0 0 0 1px #bcc2cc, inset 0 1px 2px rgba(255,255,255,0.9);
    }

    @keyframes pulse-bar {
      0%, 100% { height: 4px; }
      50% { height: 12px; }
    }
    .playing-bar-1 { animation: pulse-bar 0.7s infinite ease-in-out; }
    .playing-bar-2 { animation: pulse-bar 0.9s infinite ease-in-out 0.2s; }
    .playing-bar-3 { animation: pulse-bar 0.6s infinite ease-in-out 0.4s; }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-900 min-h-screen w-full flex items-center justify-center p-2 sm:p-4 text-slate-800">

  <div id="ipodContainer" class="ipod-chassis-white relative w-full max-w-[360px] sm:max-w-[375px] h-[670px] sm:h-[690px] rounded-[42px] p-5 flex flex-col justify-between items-center transition-colors duration-300 select-none">
    
    <!-- ÉCRAN IPOD -->
    <div class="relative w-full h-[270px] rounded-xl overflow-hidden ipod-screen border-[3px] border-[#222] flex flex-col bg-[#eff3f8]">
      
      <div id="screenHeader" class="h-6 w-full ipod-header-gradient flex items-center justify-between px-2 text-[11px] font-bold text-slate-800 shadow-sm z-10 shrink-0">
        <div class="flex items-center gap-1.5 w-14">
          <button id="headerBackBtn" class="hidden text-slate-800 hover:text-black active:scale-95 text-[11px] font-bold pr-1"><i class="fa-solid fa-chevron-left"></i></button>
          <span id="headerPlayIcon" class="hidden text-[9px] text-slate-700"><i class="fa-solid fa-play"></i></span>
          <span id="headerPauseIcon" class="hidden text-[9px] text-slate-700"><i class="fa-solid fa-pause"></i></span>
        </div>
        
        <div id="screenTitle" class="text-center truncate px-1 flex-1 tracking-tight text-black drop-shadow-[0_1px_0_rgba(255,255,255,0.7)] font-semibold">iPod</div>
        
        <div class="flex items-center justify-end gap-1.5 w-14">
          <div class="w-5 h-2.5 border border-slate-700 rounded-sm p-[1px] flex items-center"><div class="w-full h-full bg-emerald-600 rounded-[1px]"></div></div>
        </div>
      </div>

      <div class="relative flex-1 overflow-hidden flex flex-col">
        <div class="screen-glass-glare absolute inset-0 z-20 pointer-events-none"></div>

        <!-- 1. VUE MENU -->
        <div id="viewMenu" class="absolute inset-0 flex flex-col bg-white overflow-hidden">
          <div id="menuList" class="flex-1 overflow-y-auto no-scrollbar py-0 text-[13px] font-semibold text-slate-800"></div>
        </div>

        <!-- 2. VUE STREAMING YOUTUBE DIRECT -->
        <div id="viewYoutubeStream" class="absolute inset-0 hidden flex flex-col bg-white p-2">
          <div class="flex items-center justify-between mb-1">
            <p class="text-[11px] text-slate-500 font-medium">Ajouter un lien YouTube :</p>
            <button onclick="goBack()" class="text-[10px] text-blue-600 font-bold hover:underline">Fermer</button>
          </div>
          <div class="flex flex-col gap-2 mt-2">
            <input id="ytUrlInput" type="text" placeholder="Coller le lien de la vidéo..." class="w-full px-2 py-2 border border-slate-300 rounded text-[11px] focus:outline-none focus:border-red-500" />
            <button id="playYtBtn" class="w-full bg-red-600 text-white px-2 py-2 rounded text-xs hover:bg-red-700 flex items-center justify-center font-bold shadow-md">
              <i class="fa-brands fa-youtube mr-2 text-sm"></i> Ajouter et Écouter
            </button>
            <div id="ytStatus" class="text-center text-[10px] text-slate-500 mt-2 px-1 font-medium">
              Stocké automatiquement dans "Ma Musique".
            </div>
          </div>
        </div>

        <!-- 3. VUE NOW PLAYING -->
        <div id="viewNowPlaying" class="absolute inset-0 hidden flex flex-col justify-between p-3 bg-gradient-to-b from-[#ffffff] to-[#e4eaf2]">
          <div class="flex gap-3 items-center">
            <div class="relative w-24 h-24 rounded-md overflow-hidden shadow-md border border-slate-300 bg-slate-200 shrink-0">
              <img id="npCover" src="" class="w-full h-full object-cover" />
              <div id="eqBars" class="absolute bottom-1 right-1 flex items-end gap-[2px] bg-black/60 p-1 rounded backdrop-blur-sm">
                <div class="w-[2px] bg-green-400 playing-bar-1"></div>
                <div class="w-[2px] bg-green-400 playing-bar-2"></div>
                <div class="w-[2px] bg-green-400 playing-bar-3"></div>
              </div>
            </div>
            <div class="flex flex-col min-w-0 flex-1">
              <h2 id="npTitle" class="text-xs font-bold text-slate-900 truncate tracking-tight">Titre</h2>
              <p id="npArtist" class="text-[11px] text-slate-600 font-medium truncate">Artiste</p>
              <p id="npAlbum" class="text-[10px] text-slate-400 truncate">Album</p>
              <div class="mt-2 text-[10px] text-blue-700 font-semibold flex items-center gap-1">
                <span id="npSourceTag" class="bg-blue-100 text-blue-800 px-1.5 py-0.5 rounded text-[9px]">Source</span>
                <span id="npIndex">1 sur 1</span>
              </div>
            </div>
          </div>

          <div class="mt-2">
            <div class="relative w-full h-2 bg-slate-300 rounded-full overflow-hidden shadow-inner cursor-pointer" id="progressBarContainer">
              <div id="progressBar" class="h-full bg-gradient-to-r from-blue-500 to-indigo-600 w-0 transition-all duration-100"></div>
            </div>
            <div class="flex justify-between text-[10px] text-slate-600 font-mono mt-1 font-semibold">
              <span id="currentTime">0:00</span>
              <span id="totalDuration">-:--</span>
            </div>
          </div>

          <div class="mt-1 bg-white/70 backdrop-blur-sm px-2 py-1 rounded border border-slate-200 flex items-center gap-2">
            <i class="fa-solid fa-volume-low text-[10px] text-slate-500"></i>
            <div class="flex-1 h-1.5 bg-slate-200 rounded-full overflow-hidden">
              <div id="volumeBar" class="h-full bg-slate-700 w-full"></div>
            </div>
            <i class="fa-solid fa-volume-high text-[10px] text-slate-700"></i>
          </div>
        </div>

      </div>
    </div>

    <!-- ZONE CLICK WHEEL -->
    <div class="relative w-[280px] h-[280px] sm:w-[290px] sm:h-[290px] flex items-center justify-center my-auto">
      <div id="clickWheel" class="click-wheel w-full h-full rounded-full cursor-pointer relative flex items-center justify-center select-none touch-none">
        <button id="btnMenu" type="button" class="absolute top-2 text-[13px] font-bold text-slate-700 hover:text-black z-20 px-8 py-3.5 focus:outline-none">MENU</button>
        <button id="btnNext" type="button" class="absolute right-2 text-[14px] text-slate-700 hover:text-black z-20 px-4 py-8 focus:outline-none"><i class="fa-solid fa-forward-step"></i></button>
        <button id="btnPrev" type="button" class="absolute left-2 text-[14px] text-slate-700 hover:text-black z-20 px-4 py-8 focus:outline-none"><i class="fa-solid fa-backward-step"></i></button>
        <button id="btnPlayPause" type="button" class="absolute bottom-2 text-[13px] text-slate-700 hover:text-black z-20 px-8 py-3.5 flex items-center gap-1 focus:outline-none">
          <i class="fa-solid fa-play text-[10px]"></i><i class="fa-solid fa-pause text-[10px]"></i>
        </button>
        <div id="btnCenter" class="center-button w-[98px] h-[98px] rounded-full z-30 flex items-center justify-center cursor-pointer"></div>
      </div>
    </div>

    <!-- LECTEURS -->
    <input type="file" id="localFileInput" accept="audio/*" multiple class="hidden" />
    <audio id="audioPlayer" preload="auto" class="hidden"></audio>
    <div id="ytPlayerContainer" style="position:absolute; width:1px; height:1px; top:-9999px; left:-9999px; opacity:0; pointer-events:none;"></div>
  </div>

  <script>
    let library = [];
    let currentVolume = 1.0;
    let audioCtx = null;

    // --- SON DU CLIC MÉCANIQUE ---
    function initAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) audioCtx = new AudioContextClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playIpodClickSound() {
      try {
        initAudioContext();
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(1900, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(350, audioCtx.currentTime + 0.007);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.007);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.008);
      } catch (e) {}
    }

    // --- BASE DE DONNÉES INDEXEDDB ---
    let db;
    function initDB() {
      return new Promise((resolve) => {
        const request = indexedDB.open("iPodDatabaseYT", 3);
        request.onupgradeneeded = (e) => {
          db = e.target.result;
          if (!db.objectStoreNames.contains("yt_tracks")) {
            db.createObjectStore("yt_tracks", { keyPath: "id" });
          }
        };
        request.onsuccess = (e) => {
          db = e.target.result;
          loadSavedTracks(resolve);
        };
        request.onerror = () => resolve();
      });
    }

    function loadSavedTracks(callback) {
      if (!db) { if(callback) callback(); return; }
      const transaction = db.transaction(["yt_tracks"], "readonly");
      const store = transaction.objectStore("yt_tracks");
      const request = store.getAll();

      request.onsuccess = () => {
        const savedTracks = request.result;
        if (savedTracks && savedTracks.length > 0) {
          savedTracks.forEach(st => {
            if (!library.some(l => l.id === st.id)) {
              library.push(st);
            }
          });
        }
        if(callback) callback();
      };
    }

    function saveTrackToDB(trackObj) {
      if (!db) return;
      const transaction = db.transaction(["yt_tracks"], "readwrite");
      const store = transaction.objectStore("yt_tracks");
      store.put(trackObj);
    }

    function deleteTrackFromDB(trackId) {
      if (!db) return;
      const transaction = db.transaction(["yt_tracks"], "readwrite");
      const store = transaction.objectStore("yt_tracks");
      store.delete(trackId);
    }

    // --- LECTEUR YOUTUBE ---
    let ytPlayer = null;
    let isYtReady = false;

    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('ytPlayerContainer', {
        height: '200', width: '200', videoId: '',
        playerVars: { 'autoplay': 1, 'controls': 0, 'disablekb': 1, 'fs': 0, 'playsinline': 1 },
        events: {
          'onReady': () => isYtReady = true,
          'onStateChange': onYtStateChange,
          'onError': onYtError
        }
      });
    }

    function onYtStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        isPlaying = true;
        ytPlayer.setVolume(currentVolume * 100);
        const currentTrack = library[currentTrackIndex];
        if(currentTrack && (currentTrack.title === "Chargement..." || !currentTrack.title)) {
            const vData = ytPlayer.getVideoData();
            if(vData && vData.title) {
                currentTrack.title = vData.title;
                currentTrack.artist = vData.author || "YouTube";
                saveTrackToDB(currentTrack);
                updateNowPlayingUI();
            }
        }
        renderScreen();
      } else if (event.data === YT.PlayerState.PAUSED) {
        isPlaying = false;
        renderScreen();
      } else if (event.data === YT.PlayerState.ENDED) {
        playNextTrack();
      }
    }

    function onYtError(event) {
      switchToAudioFallback();
    }

    function switchToAudioFallback() {
      const track = library[currentTrackIndex];
      if (track && track.ytId) {
        track.sourceType = "Flux Direct";
        track.src = `https://invidious.nerdvpn.de/latest_version?id=${track.ytId}&itag=22`;
        playSongAtIndex(currentTrackIndex);
      }
    }

    function extractYtId(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : url;
    }

    // --- NAVIGATION ---
    const views = { MENU: "MENU", NOW_PLAYING: "NOW_PLAYING", YT_STREAM: "YT_STREAM" };
    let currentView = views.MENU;
    let menuHistory = [];
    let currentMenuKey = "main";
    let selectedIndex = 0;
    let currentTrackIndex = 0;
    let isPlaying = false;
    let progressInterval = null;

    function getMenuData(key) {
      switch (key) {
        case "main":
          return {
            title: "iPod",
            items: [
              { label: "Ma Musique (" + library.length + ")", action: () => openMenu("songs") },
              { label: "Ajouter lien YouTube", action: () => switchToView(views.YT_STREAM) },
              { label: "Importer Fichier Local", action: () => document.getElementById('localFileInput').click() },
              { label: "À l'écoute", action: () => { if(library.length > 0) switchToView(views.NOW_PLAYING); } }
            ]
          };
        case "songs":
          if (library.length === 0) return { title: "Vide", items: [{ label: "Aucun morceau", action: () => {} }] };
          return {
            title: "Ma Musique",
            items: library.map((song, idx) => ({
              label: song.title,
              subLabel: song.artist,
              action: () => playSongAtIndex(idx),
              onDelete: () => {
                deleteTrackFromDB(song.id);
                library.splice(idx, 1);
                if (currentTrackIndex >= library.length) currentTrackIndex = Math.max(0, library.length - 1);
                renderScreen();
              }
            }))
          };
        default: return { title: "iPod", items: [] };
      }
    }

    function openMenu(key) {
      playIpodClickSound();
      menuHistory.push({ key: currentMenuKey, selectedIndex });
      currentMenuKey = key;
      selectedIndex = 0;
      currentView = views.MENU;
      renderScreen();
    }

    function goBack() {
      playIpodClickSound();
      if (document.activeElement && document.activeElement.tagName === "INPUT") document.activeElement.blur();
      if (currentView !== views.MENU) { currentView = views.MENU; renderScreen(); return; }
      if (menuHistory.length > 0) {
        const prev = menuHistory.pop();
        currentMenuKey = prev.key;
        selectedIndex = prev.selectedIndex || 0;
        renderScreen();
      }
    }

    function switchToView(viewName) {
      playIpodClickSound();
      currentView = viewName;
      renderScreen();
    }

    function renderScreen() {
      document.getElementById("viewMenu").classList.add("hidden");
      document.getElementById("viewNowPlaying").classList.add("hidden");
      document.getElementById("viewYoutubeStream").classList.add("hidden");

      document.getElementById("headerBackBtn").classList.toggle("hidden", (currentView === views.MENU && currentMenuKey === "main"));
      document.getElementById("headerPlayIcon").classList.toggle("hidden", !isPlaying);
      document.getElementById("headerPauseIcon").classList.toggle("hidden", isPlaying);

      if (currentView === views.MENU) {
        document.getElementById("viewMenu").classList.remove("hidden");
        let menuData = getMenuData(currentMenuKey);
        document.getElementById("screenTitle").textContent = menuData.title;

        const menuList = document.getElementById("menuList");
        menuList.innerHTML = "";
        menuData.items.forEach((item, index) => {
          const isSel = index === selectedIndex;
          const row = document.createElement("div");
          row.className = `flex items-center justify-between px-3 py-1.5 cursor-pointer border-b border-slate-100 ${isSel ? "ipod-selected-row font-semibold" : "text-slate-800"}`;
          row.innerHTML = `<div class="truncate pr-2 flex-1"><div>${item.label}</div>${item.subLabel ? `<div class="text-[10px] ${isSel ? 'text-blue-100' : 'text-slate-400'} truncate">${item.subLabel}</div>` : ''}</div>`;
          
          if (item.onDelete) {
            row.innerHTML += `<button class="text-[11px] px-1.5 py-0.5 rounded ml-1 ${isSel ? 'text-white' : 'text-red-500'}"><i class="fa-solid fa-trash"></i></button>`;
            row.querySelector('button').onclick = (e) => { e.stopPropagation(); playIpodClickSound(); item.onDelete(); };
          } else {
            row.innerHTML += `<div class="text-[10px] font-bold ${isSel ? "text-white" : "text-slate-400"}"><i class="fa-solid fa-chevron-right"></i></div>`;
          }
          
          row.onclick = () => { playIpodClickSound(); selectedIndex = index; renderScreen(); item.action(); };
          menuList.appendChild(row);
        });
        if (menuList.children[selectedIndex]) menuList.children[selectedIndex].scrollIntoView({ block: "nearest" });
      } 
      else if (currentView === views.NOW_PLAYING) {
        document.getElementById("viewNowPlaying").classList.remove("hidden");
        document.getElementById("screenTitle").textContent = "À l'écoute";
        updateNowPlayingUI();
      }
      else if (currentView === views.YT_STREAM) {
        document.getElementById("viewYoutubeStream").classList.remove("hidden");
        document.getElementById("screenTitle").textContent = "Ajouter Lien";
      }
    }

    const audioPlayer = document.getElementById("audioPlayer");

    function playSongAtIndex(index) {
      if (index < 0 || index >= library.length) return;
      currentTrackIndex = index;
      const track = library[currentTrackIndex];

      audioPlayer.pause();
      if(isYtReady) ytPlayer.stopVideo();
      clearInterval(progressInterval);

      if (track.sourceType === "YouTube") {
        if (!isYtReady) { 
          switchToAudioFallback();
          return;
        }
        ytPlayer.loadVideoById(track.ytId);
        ytPlayer.setVolume(currentVolume * 100);
        startProgressTracker("yt");
        
        // Sécurité anti-blocage : si au bout de 2.5 secondes YouTube ne démarre pas, bascule sur le lecteur direct
        setTimeout(() => {
          if (!isPlaying && library[currentTrackIndex]?.id === track.id && currentView === views.NOW_PLAYING) {
            switchToAudioFallback();
          }
        }, 2500);

      } else {
        audioPlayer.src = track.src;
        audioPlayer.volume = currentVolume;
        audioPlayer.play().then(() => { isPlaying = true; }).catch(() => { isPlaying = false; });
        startProgressTracker("html5");
      }
      switchToView(views.NOW_PLAYING);
    }

    function togglePlayPause() {
      playIpodClickSound();
      if (library.length === 0) return;
      const track = library[currentTrackIndex];
      
      if (track.sourceType === "YouTube" && isYtReady) {
        if (ytPlayer.getPlayerState() === YT.PlayerState.PLAYING) { ytPlayer.pauseVideo(); isPlaying = false; }
        else { ytPlayer.playVideo(); isPlaying = true; }
      } else {
        if (audioPlayer.paused) { audioPlayer.play(); isPlaying = true; }
        else { audioPlayer.pause(); isPlaying = false; }
      }
      renderScreen();
    }

    function playNextTrack() {
      playIpodClickSound();
      if (library.length === 0) return;
      currentTrackIndex = (currentTrackIndex + 1) % library.length;
      playSongAtIndex(currentTrackIndex);
    }
    function playPrevTrack() {
      playIpodClickSound();
      if (library.length === 0) return;
      currentTrackIndex = (currentTrackIndex - 1 + library.length) % library.length;
      playSongAtIndex(currentTrackIndex);
    }

    function startProgressTracker(type) {
      clearInterval(progressInterval);
      progressInterval = setInterval(() => {
        let current = 0, total = 0;
        if (type === "yt" && isYtReady) {
          current = ytPlayer.getCurrentTime() || 0;
          total = ytPlayer.getDuration() || 0;
        } else {
          current = audioPlayer.currentTime || 0;
          total = audioPlayer.duration || 0;
        }
        if (total > 0 && !isNaN(total)) {
          document.getElementById("progressBar").style.width = `${(current / total) * 100}%`;
          document.getElementById("currentTime").textContent = formatTime(current);
          document.getElementById("totalDuration").textContent = "-" + formatTime(total - current);
        }
      }, 500);
    }

    function updateNowPlayingUI() {
      const track = library[currentTrackIndex];
      if (!track) return;
      document.getElementById("npTitle").textContent = track.title;
      document.getElementById("npArtist").textContent = track.artist;
      document.getElementById("npAlbum").textContent = track.album || "";
      document.getElementById("npCover").src = track.cover || "";
      document.getElementById("npIndex").textContent = `${currentTrackIndex + 1} / ${library.length}`;
      document.getElementById("npSourceTag").textContent = track.sourceType;
      document.getElementById("eqBars").classList.toggle("hidden", !isPlaying);
      document.getElementById("volumeBar").style.width = `${currentVolume * 100}%`;
    }

    function formatTime(sec) {
      if (isNaN(sec) || sec < 0) return "0:00";
      const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    // --- BOUTONS IPOD ---
    document.getElementById("btnMenu").onclick = () => { playIpodClickSound(); goBack(); };
    document.getElementById("headerBackBtn").onclick = () => { playIpodClickSound(); goBack(); };
    
    document.getElementById("btnCenter").onclick = () => {
      playIpodClickSound();
      initAudioContext();
      if (currentView === views.MENU) {
        let menuData = getMenuData(currentMenuKey);
        if (menuData.items[selectedIndex]) menuData.items[selectedIndex].action();
      } else if (currentView === views.NOW_PLAYING) togglePlayPause();
    };

    document.getElementById("btnPlayPause").onclick = () => { initAudioContext(); togglePlayPause(); };
    document.getElementById("btnNext").onclick = () => { initAudioContext(); playNextTrack(); };
    document.getElementById("btnPrev").onclick = () => { initAudioContext(); playPrevTrack(); };

    // --- MOLETTE TACTILE (Volume & Menu) ---
    const clickWheel = document.getElementById("clickWheel");
    let isTrackingWheel = false, lastAngle = 0, accumulatedAngle = 0;
    
    function getAngle(e) {
      const rect = clickWheel.getBoundingClientRect();
      return (Math.atan2(e.clientY - (rect.top + rect.height / 2), e.clientX - (rect.left + rect.width / 2)) * (180 / Math.PI) + 360) % 360;
    }

    clickWheel.addEventListener("pointerdown", (e) => {
      if (e.target.closest("button") || e.target.closest("#btnCenter")) return;
      isTrackingWheel = true; lastAngle = getAngle(e); accumulatedAngle = 0;
      clickWheel.setPointerCapture(e.pointerId);
    });

    clickWheel.addEventListener("pointermove", (e) => {
      if (!isTrackingWheel) return;
      let delta = getAngle(e) - lastAngle;
      if (delta > 180) delta -= 360; if (delta < -180) delta += 360;
      accumulatedAngle += delta; lastAngle = getAngle(e);

      if (Math.abs(accumulatedAngle) >= 15) {
        playIpodClickSound();
        const direction = accumulatedAngle > 0 ? 1 : -1;
        if (currentView === views.MENU) {
          const total = getMenuData(currentMenuKey).items.length;
          selectedIndex = Math.max(0, Math.min(total - 1, selectedIndex + direction));
          renderScreen();
        } else if (currentView === views.NOW_PLAYING) {
          currentVolume = Math.max(0, Math.min(1, currentVolume + (direction * 0.05)));
          audioPlayer.volume = currentVolume;
          if (isYtReady && ytPlayer.setVolume) ytPlayer.setVolume(currentVolume * 100);
          document.getElementById("volumeBar").style.width = `${currentVolume * 100}%`;
        }
        accumulatedAngle = 0;
      }
    });

    clickWheel.addEventListener("pointerup", () => isTrackingWheel = false);

    // --- AJOUT YOUTUBE ---
    document.getElementById("playYtBtn").onclick = () => {
      playIpodClickSound();
      initAudioContext();
      const input = document.getElementById("ytUrlInput").value.trim();
      if (!input) return;
      const ytId = extractYtId(input);
      if (!ytId) { alert("Lien invalide"); return; }

      const trackObj = {
        id: "yt-" + ytId,
        title: "Vidéo YouTube",
        artist: "YouTube",
        album: "Stream",
        cover: `https://img.youtube.com/vi/${ytId}/hqdefault.jpg`,
        ytId: ytId,
        sourceType: "YouTube",
        isLocal: false
      };
      
      library.unshift(trackObj);
      saveTrackToDB(trackObj);
      
      document.getElementById("ytUrlInput").value = "";
      playSongAtIndex(0);
    };

    // --- IMPORT LOCAL ---
    document.getElementById("localFileInput").onchange = (e) => {
      initAudioContext();
      Array.from(e.target.files).forEach(file => {
        const trackObj = {
          id: "loc-" + Date.now() + Math.random(), title: file.name.replace(/\.[^/.]+$/, ""), artist: "Local",
          album: "Importé", cover: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=300&auto=format&fit=crop&q=80",
          src: URL.createObjectURL(file), sourceType: "Local", isLocal: true
        };
        library.unshift(trackObj);
        saveTrackToDB(trackObj);
      });
      playSongAtIndex(0);
    };

    window.onload = () => {
      initDB().then(() => renderScreen());
    };
  </script>
</body>
</html>
